name: Publish Helm Charts to GHCR

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [stack-gate, gpu-smoke-test]
    env:
      CHART_PATH: charts/${{ matrix.chart }}
      CHART_NAME: ${{ matrix.chart }}
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Validate chart
        run: |
          set -euo pipefail
          helm lint "${CHART_PATH}"
          helm template test "${CHART_PATH}" --namespace gpu-stack > /dev/null

      - name: Validate gate chart in its other two modes
        if: matrix.chart == 'stack-gate'
        run: |
          set -euo pipefail
          # cert-manager check: no capacity gate, no contract.
          helm template test "${CHART_PATH}" --namespace gpu-stack \
            --set wait.resource=deployment/cert-manager-webhook \
            --set wait.namespace=cert-manager \
            --set wait.condition=condition=Available \
            --set capacity.min=0 \
            --set contract.name="" > /dev/null
          # Argo CD already has a ClusterPolicy health check: no wait, capacity only.
          helm template test "${CHART_PATH}" --namespace gpu-stack \
            --set wait.resource="" > /dev/null

      - name: Resolve release coordinates
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag ${RELEASE_TAG} is not a valid Helm semantic version"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "repository=oci://ghcr.io/${owner}/charts" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR with Helm
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Package and push OCI chart
        shell: bash
        run: |
          set -euo pipefail
          package_directory="${RUNNER_TEMP}/helm-packages"
          mkdir -p "${package_directory}"
          helm package "${CHART_PATH}" \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.version }}" \
            --destination "${package_directory}"
          helm push \
            "${package_directory}/${CHART_NAME}-${{ steps.release.outputs.version }}.tgz" \
            "${{ steps.release.outputs.repository }}"
